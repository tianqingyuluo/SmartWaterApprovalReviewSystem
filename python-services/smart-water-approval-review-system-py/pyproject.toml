[project]
name = "smart-water-approval-review-system-py"
version = "0.1.0"
description = "SmartWater Python OCR and Review Reasoning Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "openai>=1.58.0",
]

[project.optional-dependencies]
dashscope = ["dashscope>=1.21.0"]
dev = ["ruff>=0.8.0", "mypy>=1.13.0"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
