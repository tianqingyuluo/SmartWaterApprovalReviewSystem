spring:
  config:
    import: ""  # do not import application-secrets.yaml in tests
  datasource:
    url: jdbc:h2:mem:smartwater;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

storage:
  s3:
    endpoint: http://localhost:9000
    bucket-name: test-bucket
    region: us-east-1
    access-key: ""
    secret-key: ""

water-approval:
  worker:
    token: test-worker-token
  ai-service:
    base-url: http://localhost:8000
    health-path: /health
    internal-token: test-ai-token
    timeout: 1s
    mcp-transport: streamable-http
    mcp-path: /mcp
    ingest:
      workdir: ../../python-services/smart-water-approval-review-system-py
      source-dir: ../../docs/参考资料
      chunk-size: 512
      chunk-overlap: 64
      rebuild: false

logging:
  level:
    com.tianqingyuluo.waterapproval: WARN
