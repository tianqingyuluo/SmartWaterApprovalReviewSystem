services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartwater}
      MYSQL_USER: ${MYSQL_USER:-smartwater}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../java-services/water-approval/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command:
      - --access-key
      - ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      - --secret-key
      - ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      - --console-enable
      - /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data

  python-ai:
    build:
      context: ..
      dockerfile: deploy/python-ai/Dockerfile
    restart: unless-stopped
    environment:
      PROJECT_ROOT: /app
      BACKEND_API_BASE: ${BACKEND_API_BASE:-http://java-backend:8080/api}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      OCR_PROVIDER: ${OCR_PROVIDER:-glm}
      OCR_GLM_API_KEY: ${OCR_GLM_API_KEY:?OCR_GLM_API_KEY is required}
      OCR_GLM_BASE_URL: ${OCR_GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      REVIEW_LLM_PROVIDER: ${REVIEW_LLM_PROVIDER:-dashscope}
      REVIEW_LLM_MODEL: ${REVIEW_LLM_MODEL:-qwen-max}
      REVIEW_LLM_BASE_URL: ${REVIEW_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      REVIEW_LLM_API_KEY: ${REVIEW_LLM_API_KEY:?REVIEW_LLM_API_KEY is required}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      KNOWLEDGE_PACK_DIR: ${KNOWLEDGE_PACK_DIR:-/app/knowledge_pack}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/data/chroma}
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-knowledge_base}
      KNOWLEDGE_SOURCE_DIR: ${KNOWLEDGE_SOURCE_DIR:-/app/knowledge_source}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-64}
      SOFFICE_PATH: ${SOFFICE_PATH:-/usr/bin/soffice}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_SERVER_COMMAND: python
      MCP_SERVER_ARGS: "-m src.mcp_server.app --transport stdio"
      MCP_SERVER_CWD: /app
      MCP_SERVER_ENV: "KNOWLEDGE_PACK_DIR=/app/knowledge_pack,LOG_LEVEL=${LOG_LEVEL:-INFO}"
    ports:
      - "${PYTHON_AI_PORT:-8000}:8000"
    volumes:
      - chroma-data:/app/data/chroma
      - knowledge-source:/app/knowledge_source
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

  java-backend:
    build:
      context: ..
      dockerfile: deploy/java-backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartwater}
      MYSQL_USER: ${MYSQL_USER:-smartwater}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-smartwater}
      S3_REGION: ${S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      STORAGE_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      WORKER_TOKEN: ${WORKER_TOKEN:?WORKER_TOKEN is required}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://python-ai:8000}
      AI_SERVICE_HEALTH_PATH: ${AI_SERVICE_HEALTH_PATH:-/health}
      AI_SERVICE_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-10s}
      AI_SERVICE_MCP_TRANSPORT: ${AI_SERVICE_MCP_TRANSPORT:-streamable-http}
      AI_SERVICE_MCP_PATH: ${AI_SERVICE_MCP_PATH:-/mcp}
      AI_SERVICE_MCP_KNOWLEDGE_SEARCH_PATH: ${AI_SERVICE_MCP_KNOWLEDGE_SEARCH_PATH:-/api/mcp/tools/knowledge_search}
      AI_SERVICE_MCP_CHECK_COMPLETENESS_PATH: ${AI_SERVICE_MCP_CHECK_COMPLETENESS_PATH:-/api/mcp/tools/check_completeness}
      AI_REVIEW_TASK_DISPATCH_ENABLED: ${AI_REVIEW_TASK_DISPATCH_ENABLED:-true}
      AI_REVIEW_TASK_PATH: ${AI_REVIEW_TASK_PATH:-/api/review/tasks}
      AI_REVIEW_TASK_MAX_ATTEMPTS: ${AI_REVIEW_TASK_MAX_ATTEMPTS:-3}
      AI_INGEST_WORKDIR: ${AI_INGEST_WORKDIR:-/app}
      AI_INGEST_SOURCE_DIR: ${AI_INGEST_SOURCE_DIR:-/app/knowledge_source}
      AI_INGEST_CHUNK_SIZE: ${AI_INGEST_CHUNK_SIZE:-512}
      AI_INGEST_CHUNK_OVERLAP: ${AI_INGEST_CHUNK_OVERLAP:-64}
      AI_INGEST_REBUILD: ${AI_INGEST_REBUILD:-false}
      TZ: Asia/Shanghai
    ports:
      - "${JAVA_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/ai/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      java-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  rustfs-data:
  chroma-data:
  knowledge-source:
